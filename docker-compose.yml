services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tenderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenderflow
      POSTGRES_PASSWORD: tenderflow
      POSTGRES_DB: tenderflow
    ports:
      - "5433:5432"
    volumes:
      - tenderflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderflow -d tenderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tenderflow-postgres-data:
