_schema-version: "3.1"
ID: tender-platform
description: SAP BTP Tender Management Platform
version: 1.0.0

build-parameters:
  before-all:
    - builder: custom
      commands:
        # 1. Build React → outputs to cap-backend/app/ (see vite.config.js outDir).
        #    tender-cap-srv serves both the static app and the OData API from the
        #    same origin in production, so the API base has no /api prefix (that
        #    prefix only exists for the Vite dev-server proxy).
        - npm ci --prefix react-frontend
        - sh -c "VITE_API_BASE_URL= npm run build --prefix react-frontend"
        # 2. Run cds build — generates gen/srv (Node.js app) and gen/pg (Postgres
        #    schema deploy artifacts). cds build does NOT copy app/ into gen/srv
        #    on its own, so step 3 does it explicitly.
        - npm ci --prefix cap-backend
        - npm run build --prefix cap-backend
        # 3. Copy the built React static files into the deployable srv folder.
        - cp -r cap-backend/app cap-backend/gen/srv/app

modules:
  # ── Python AI Service ──────────────────────────────────────────────────────
  # Deployed first so its CF URL is available for the CAP module env var.
  - name: tender-python-ai
    type: python
    path: python-ai-service
    parameters:
      buildpack: python_buildpack
      memory: 2048M
      disk-quota: 3G
    build-parameters:
      ignore:
        - .venv/
        - __pycache__/
        - uploads/
        - .env
    provides:
      - name: tender-python-ai-api
        properties:
          url: ${default-url}
    requires:
      - name: tender-postgres
    # NOTE: After deploying, set AI Core credentials on this CF app:
    #   cf set-env tender-python-ai TOKEN_URL      "<value>"
    #   cf set-env tender-python-ai CLIENT_ID      "<value>"
    #   cf set-env tender-python-ai CLIENT_SECRET  "<value>"
    #   cf set-env tender-python-ai MODEL_BASE_URL "<value>"
    #   cf set-env tender-python-ai MODEL_ENDPOINT "<value>"
    #   cf restage tender-python-ai

  # ── CAP Backend (Node.js service + React static files) ────────────────────
  - name: tender-cap-srv
    type: nodejs
    path: cap-backend/gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 512M
    properties:
      NODE_ENV: production
      PYTHON_AI_URL: ~{tender-python-ai-api/url}
    requires:
      - name: tender-postgres
      - name: tender-xsuaa
      - name: tender-python-ai-api

  # ── Postgres DB Deployer ───────────────────────────────────────────────────
  # One-shot CF task that pushes schema artifacts into the Postgres instance.
  - name: tender-db-deployer
    type: nodejs
    path: cap-backend/gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      memory: 256M
      disk-quota: 256M
      tasks:
        - name: deploy
          command: npm start
          memory: 256M
    requires:
      - name: tender-postgres

resources:
  # ── PostgreSQL (managed service) ───────────────────────────────────────────
  - name: tender-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial
      config:
        extensions: ["vector"]

  # ── XSUAA (OAuth2 / authentication) ───────────────────────────────────────
  - name: tender-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
